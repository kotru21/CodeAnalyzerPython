[project]
name = "analyzer-service"
version = "0.1.0"
description = "Static vulnerability analyzer for JavaScript/TypeScript code"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "celery[redis]>=5.6",
    # kombu[redis] (via celery[redis]) requires redis<6.5
    "redis>=6.4,<8.2",
    "sqlalchemy>=2.0.51",
    "alembic>=1.19",
    "psycopg2-binary>=2.9.12",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pyyaml>=6.0.3",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "mypy>=2.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery.*", "tree_sitter.*", "tree_sitter_javascript.*", "tree_sitter_typescript.*"]
ignore_missing_imports = true
